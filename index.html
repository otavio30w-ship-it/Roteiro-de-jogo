<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Adivinhação de Palavras</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="jogo">
    <header>
      <h1>Adivinhe a Palavra</h1>
      <p id="dica" class="dica">Dica: carregando...</p>
    </header>

    <section aria-label="Área da palavra secreta">
      <p id="palavra">_ _ _ _ _</p>
      <p>Tentativas restantes: <strong id="tentativas">6</strong></p>
    </section>

    <section class="controles" aria-label="Entrada de letras">
      <label for="letra">Digite uma letra:</label>
      <input id="letra" type="text" maxlength="1" autocomplete="off">
      <button id="btn-tentar" type="button">Tentar</button>
    </section>

    <p id="mensagem" class="mensagem" role="status"></p>

    <section class="historico" aria-label="Histórico e placar">
      <p>Letras utilizadas: <span id="letras-usadas">Nenhuma</span></p>
      <p class="placar">
        Vitórias: <strong id="vitorias">0</strong> | 
        Derrotas: <strong id="derrotas">0</strong>
      </p>
    </section>

    <footer>
      <button id="btn-reiniciar" type="button">Nova partida</button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
